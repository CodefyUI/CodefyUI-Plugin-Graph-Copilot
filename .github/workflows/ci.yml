name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-dist:
    name: UI tests, coverage, and bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install UI dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ui
      - name: Run UI tests with coverage
        run: pnpm run test:coverage
        working-directory: ui
      - name: Type-check and build UI
        run: pnpm run build
        working-directory: ui
      - name: Verify committed frontend bundle is current
        shell: bash
        run: |
          if ! git diff --exit-code -- frontend/; then
            echo "::error::frontend/ bundle is stale; run 'pnpm run build' in ui/ and commit the result"
            exit 1
          fi

  browser:
    name: Isolated Chromium browser regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install UI dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ui
      - name: Install Chromium and browser dependencies
        run: pnpm exec playwright install --with-deps chromium
        working-directory: ui
      - name: Type-check and build UI
        run: pnpm run build
        working-directory: ui
      - name: Run isolated browser regressions
        run: pnpm run test:e2e --workers=2
        working-directory: ui
      - name: Upload browser report, screenshots, and traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: chromium-browser-failure
          path: |
            ui/playwright-report/
            ui/test-results/
          if-no-files-found: ignore
          retention-days: 7

  docs:
    name: Documentation type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install documentation dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check documentation
        run: pnpm run typecheck
      - name: Build English and Traditional Chinese documentation
        run: pnpm run build
