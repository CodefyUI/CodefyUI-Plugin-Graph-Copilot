[plugin]
id              = "graph-copilot"
name            = "Copilot — General Agent"
version         = "0.5.0"
description     = "A general agent for CodefyUI: follows Agent Skills and AGENTS.md, builds and validates graphs, opens graphs and examples in tabs, reads and commits project files with approval, and runs approved isolated experiments with portable evidence."
schema_version  = 1
requires_codefyui = ">=1.3.0"
authors         = ["treeleaves30760"]
license         = "MIT"
homepage        = "https://github.com/CodefyUI/CodefyUI-Plugin-Graph-Copilot"

[frontend]
entry = "frontend/index.js"
